[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "multimodel-rag-graph-search"
version = "0.1.0"
description = "Production-grade Multimodal Graph RAG engine combining Knowledge Graphs, Vector Search, and Vision LLMs"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Multimodal Graph RAG Team" }
]
dependencies = [
    # API & Async Core
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "loguru>=0.7.2",
    "python-dotenv>=1.0.1",

    # Background Tasks & Cache
    "redis>=5.0.0",
    "arq>=0.25.0",

    # Graph Database
    "neo4j>=5.18.0",
    "networkx>=3.2.1",

    # Vector Storage
    "qdrant-client>=1.8.0",

    # Multimodal Processing & Documents
    "pillow>=10.2.0",
    "pymupdf>=1.23.26",
    "python-magic-bin>=0.4.14; platform_system == 'Windows'",
    "python-magic>=0.4.27; platform_system != 'Windows'",

    # LLM & Embeddings integrations
    "openai>=1.14.0",
    "google-generativeai>=0.4.1",
    "anthropic>=0.19.0",
    "numpy>=1.26.0",

    # Object Storage
    "minio>=7.2.5",
    "boto3>=1.34.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.2",
    "mypy>=1.9.0",
    "types-Pillow>=10.2.0"
]

[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
